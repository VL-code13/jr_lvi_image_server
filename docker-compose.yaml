# Секция services — определяет все сервисы (контейнеры), которые будут запущены
services:
  # Сервис app — основное приложение (сервер для работы с изображениями)
  app:
    # Сборка образа из Dockerfile в текущей директории
    build: .
    # Явное задание имени контейнера (удобно для идентификации)
    container_name: image_server_app
    # Политика перезапуска: перезапускать контейнер, если он остановился, кроме случая явной остановки пользователем
    restart: unless-stopped


    # Проброс портов: хост:контейнер
    # Порт 3000 на хосте будет перенаправляться на порт 3000 внутри контейнера
    ports:
      - "3000:3000"

    # Переменные окружения, доступные внутри контейнера
    environment:
      # Путь к папке для сохранения изображений внутри контейнера
      IMAGES_DIR: /images
      # Путь к папке для логов внутри контейнера
      LOGS_DIR: /logs

    # Монтирование томов: связывает папки/тома с контейнером
    volumes:
      # Именованный том 'images' монтируется в папку /images внутри контейнера (для записи)
      - images:/images
      # Именованный том 'logs' монтируется в папку /logs внутри контейнера (для записи)
      - logs:/logs

  # Сервис nginx — веб‑сервер для раздачи статических файлов (изображений)
  nginx:
    # Использование готового образа nginx версии 1.27 на базе Alpine Linux (лёгкий дистрибутив)
    image: nginx:1.27-alpine
    # Имя контейнера для сервиса nginx
    container_name: images_server_nginx
    # Политика перезапуска аналогична сервису app
    restart: unless-stopped

    # Зависимость от сервиса app: nginx запустится только после успешного запуска app
    depends_on:
      - app

    # Проброс портов для nginx: порт 8000 на хосте → порт 80 внутри контейнера (стандартный HTTP)
    ports:
      - "8000:80"

    # Монтирование томов и файлов для nginx
    volumes:
      # Конфигурационный файл nginx с хоста монтируется внутрь контейнера (только для чтения)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Именованный том 'images' монтируется в /images внутри nginx (только для чтения — ro)
      # Это позволяет nginx раздавать изображения, сохранённые сервисом app
      - images:/images:ro

# Секция volumes — объявление именованных томов Docker
# Docker автоматически создаст эти тома при первом запуске и будет ими управлять
volumes:
  # Том для хранения изображений
  images:
  # Том для хранения логов приложения
  logs:

