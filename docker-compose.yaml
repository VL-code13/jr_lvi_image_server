version: '3.9'

services:
  app:
    build: .
    container_name: image_server_app
    restart: unless-stopped

    ports:
      - "3000:3000"
    environment:
      IMAGES_DIR: /images
      LOGS_DIR: /logs

    volumes:
      - images:/images
      - logs:/logs

    nginx:
      image: nginx:1.27-alpine
      container_name: images_server_n0ginx
      restart: unless-stopped

      depends_on:
        - app

      ports:
        - "8000:80"

      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - images:/images:ro

  volumes:
    images:
    logs:

